name: Homey App Publication Pipeline
on:
  workflow_dispatch:

jobs:
  publish-homey-app:
    name: Publish to Homey App Store
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Pinned to latest stable version

      - name: Publish Application
        uses: athombv/github-action-homey-app-publish@master  # Using master branch; update to stable release if available
        id: publish-step
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}
        timeout-minutes: 5  # Add execution timeout
        continue-on-error: false  # Ensure strict failure mode

      - name: Generate Management URL
        if: ${{ success() }}
        run: |
          echo "Application successfully published!" >> $GITHUB_STEP_SUMMARY
          echo "Manage your app at ${{ steps.publish-step.outputs.url }}" >> $GITHUB_STEP_SUMMARY

      - name: Failure Summary
        if: ${{ failure() }}
        run: echo "Publication failed. Check the Publish Application step log." >> $GITHUB_STEP_SUMMARY
