<html>
  <head>
    <style>
      :root {
        --widget-size: 2;
      }

      .widget-container {
        padding: var(--homey-su-2);
      }

      .vehicle-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--homey-su-2);
      }

      .info-card {
        background: var(--homey-color-ui-surface-secondary);
        border-radius: var(--homey-border-radius);
        padding: var(--homey-su-2);
      }

      .info-card.full-width {
        grid-column: 1 / -1;
      }

      .info-card-title {
        color: var(--homey-color-text-subtle);
        font-size: 12px;
        margin-bottom: var(--homey-su-1);
      }

      .info-card-value {
        color: var(--homey-color-text);
        font-size: 16px;
        font-weight: 500;
      }

      .battery-section {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--homey-su-2);
      }

      .battery-level {
        flex: 1;
        height: 8px;
        background: var(--homey-color-ui-surface-secondary);
        border-radius: 4px;
        overflow: hidden;
      }

      .battery-level-fill {
        height: 100%;
        background: var(--homey-color-green);
        transition: width 0.3s ease;
      }

      .error-message {
        color: var(--homey-color-error);
        text-align: center;
        padding: var(--homey-su-4);
      }

      .location-link {
        color: var(--homey-color-primary);
        text-decoration: none;
      }

      .location-link:hover {
        text-decoration: underline;
      }

      .charging-power {
        color: var(--homey-color-green);
      }

      .charging-power.discharging {
        color: var(--homey-color-orange);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--homey-widget-padding);
        font-family: var(--homey-font-family);
        color: var(--homey-text-color);
        background: var(--homey-background);
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--homey-widget-padding);
      }

      .info-container {
        display: flex;
        flex-direction: column;
        gap: calc(var(--homey-widget-padding) * 0.75);
      }

      .info-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--homey-font-size);
      }

      .info-row i {
        width: 20px;
        text-align: center;
        color: var(--homey-text-color);
      }

      .location {
        font-size: var(--homey-font-size-small);
        color: var(--homey-text-dimmed);
      }

      .charging-button {
        padding: var(--homey-widget-padding);
        border-radius: var(--homey-border-radius);
        border: none;
        background: var(--homey-button-primary-background);
        color: var(--homey-button-primary-text-color);
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .charging-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: var(--homey-button-disabled-background);
        color: var(--homey-button-disabled-text-color);
      }

      .charging-button i {
        font-size: var(--homey-font-size);
      }

      .charging-buttons {
        display: flex;
        gap: 10px;
        margin-top: var(--homey-widget-padding);
      }

      :root[data-homey-widget-size="1"] .info-row:nth-child(n+4) {
        display: none;
      }

      :root[data-homey-widget-size="3"] .container {
        gap: calc(var(--homey-widget-padding) * 1.5);
      }

      .error-message {
        color: var(--homey-color-error);
        font-size: var(--homey-font-size-small);
        padding: var(--homey-widget-padding);
        border-radius: var(--homey-border-radius);
        background: var(--homey-color-error-light);
        margin-bottom: var(--homey-widget-padding);
      }

      @media (prefers-color-scheme: dark) {
        .charging-button:disabled {
          background-color: var(--disabled-background-dark, #333);
          color: var(--disabled-text-dark, #999);
          border-color: var(--disabled-color-dark, #444);
        }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="container">
      <div id="error-container" style="display: none;" class="error-message"></div>
      
      <div id="vehicle-container" class="vehicle-info">
        <div class="battery-section">
          <div class="info-card-value" id="battery-percentage">--</div>
          <div class="battery-level">
            <div class="battery-level-fill" id="battery-level-fill" style="width: 0%"></div>
          </div>
          <div class="info-card-value" id="range">-- km</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Charging Status</div>
          <div class="info-card-value" id="charging-status">--</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Plugged In</div>
          <div class="info-card-value" id="plugged-status">--</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Last Updated</div>
          <div class="info-card-value" id="last-seen">--</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Charging Power</div>
          <div class="info-card-value">
            <span id="charging-power" class="charging-power">--</span>
          </div>
        </div>

        <div class="info-card full-width">
          <div class="info-card-title">Location</div>
          <div class="info-card-value" id="location">
            <span id="address">--</span>
            <br>
            <small><a href="#" class="location-link" id="map-link">View on Map</a></small>
          </div>
        </div>
      </div>
      
      <div class="charging-buttons">
        <button id="startCharging" class="charging-button" disabled>
          <i class="fas fa-bolt"></i>
          Start Charging
        </button>
        <button id="stopCharging" class="charging-button" disabled>
          <i class="fas fa-stop"></i>
          Stop Charging
        </button>
      </div>
    </div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        // Signal that the widget is ready
        Homey.ready();

        const settings = Homey.getSettings();
        const refreshRate = (settings.refresh_interval || 5) * 60 * 1000; // Convert minutes to ms

        function showError(message) {
          const errorContainer = document.getElementById('error-container');
          const vehicleContainer = document.getElementById('vehicle-container');
          errorContainer.textContent = message;
          errorContainer.style.display = 'block';
          vehicleContainer.style.display = 'none';
        }

        function hideError() {
          const errorContainer = document.getElementById('error-container');
          const vehicleContainer = document.getElementById('vehicle-container');
          errorContainer.style.display = 'none';
          vehicleContainer.style.display = 'grid';
        }

        function formatLastSeen(timestamp) {
          if (!timestamp) return '--';
          const date = new Date(timestamp);
          return date.toLocaleTimeString();
        }

        function formatChargingPower(power) {
          if (!power) return '--';
          const powerValue = parseFloat(power);
          if (isNaN(powerValue)) return '--';
          const powerElement = document.getElementById('charging-power');
          powerElement.classList.remove('charging', 'discharging');
          if (powerValue > 0) {
            powerElement.classList.add('charging');
            return `+${powerValue.toFixed(1)} kW`;
          } else if (powerValue < 0) {
            powerElement.classList.add('discharging');
            return `${powerValue.toFixed(1)} kW`;
          }
          return '0 kW';
        }

        function createLocationDisplay(location, address) {
          const addressElement = document.getElementById('address');
          const mapLink = document.getElementById('map-link');
          if (!location || !location.latitude || !location.longitude) {
            addressElement.textContent = '--';
            mapLink.style.display = 'none';
            return;
          }
          addressElement.textContent = address || `${location.latitude.toFixed(6)}, ${location.longitude.toFixed(6)}`;
          const mapUrl = `https://www.google.com/maps?q=${location.latitude},${location.longitude}`;
          mapLink.style.display = 'inline';
          mapLink.onclick = (e) => {
            e.preventDefault();
            Homey.popup(mapUrl);
          };
        }

        function updateVehicleData() {
          Homey.api('GET', '/vehicle-data')
            .then(data => {
              if (data.error) {
                showError(data.error);
                return;
              }
              hideError();

              // Update battery info and range
              const batteryLevel = parseFloat(data.batteryLevel) || 0;
              document.getElementById('battery-percentage').textContent = `${Math.round(batteryLevel)}%`;
              document.getElementById('battery-level-fill').style.width = `${batteryLevel}%`;
              document.getElementById('range').textContent = `${Math.round(parseFloat(data.range) || 0)} km`;

              // Update status cards
              document.getElementById('charging-status').textContent = data.chargingStatus || '--';
              document.getElementById('plugged-status').textContent = data.pluggedInStatus ? 'Yes' : 'No';
              document.getElementById('last-seen').textContent = formatLastSeen(data.lastSeen);
              document.getElementById('charging-power').textContent = formatChargingPower(data.powerDeliveryState);

              // Update charging buttons based on status
              const startChargingButton = document.getElementById('startCharging');
              const stopChargingButton = document.getElementById('stopCharging');
              const canStartCharging = data.pluggedInStatus && data.chargingStatus !== 'charging';
              startChargingButton.disabled = !canStartCharging;
              stopChargingButton.disabled = data.chargingStatus !== 'charging';

              // Update location info
              createLocationDisplay(data.location, data.address);
            })
            .catch(error => {
              showError(error.message || 'Failed to fetch vehicle data');
            });
        }

        // Initial update
        updateVehicleData();

        // Set up start charging button
        const startChargingButton = document.getElementById('startCharging');
        startChargingButton.onclick = () => {
          startChargingButton.disabled = true; // Prevent multiple clicks
          Homey.api('POST', '/start-charging')
            .then(response => {
              if (response.error) {
                showError(response.error);
              } else {
                // Wait a bit before refreshing to allow state change
                setTimeout(updateVehicleData, 10000);
              }
            })
            .catch(error => {
              showError(error.message || 'Failed to start charging');
              startChargingButton.disabled = false;
            });
        };

        // Set up stop charging button
        const stopChargingButton = document.getElementById('stopCharging');
        stopChargingButton.onclick = () => {
          stopChargingButton.disabled = true;
          Homey.api('POST', '/stop-charging')
            .then(response => {
              if (response.error) {
                showError(response.error);
              } else {
                setTimeout(updateVehicleData, 10000);
              }
            })
            .catch(error => {
              showError(error.message || 'Failed to stop charging');
              stopChargingButton.disabled = false;
            });
        };

        // Set up periodic updates
        const updateInterval = setInterval(updateVehicleData, refreshRate);

        window.addEventListener('beforeunload', () => {
          if (updateInterval) {
            clearInterval(updateInterval);
          }
        });
      }
    </script>
  </body>
</html>
