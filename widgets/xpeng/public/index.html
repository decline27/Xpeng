<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--homey-widget-padding, 12px);
        font-family: var(--homey-font-family);
        color: var(--homey-text-color);
        background: var(--homey-background);
      }

      .vehicle-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--homey-su-2, 8px);
      }

      .info-card {
        background: var(--homey-color-ui-surface-secondary);
        border-radius: var(--homey-border-radius);
        padding: var(--homey-su-2, 8px);
      }

      .info-card.full-width,
      .battery-section {
        grid-column: 1 / -1;
      }

      .info-card-title {
        color: var(--homey-color-text-subtle);
        font-size: 12px;
        margin-bottom: var(--homey-su-1, 4px);
      }

      .info-card-value {
        font-size: 16px;
        font-weight: 500;
      }

      .battery-section {
        display: flex;
        align-items: center;
        gap: var(--homey-su-2, 8px);
      }

      .battery-level {
        flex: 1;
        height: 8px;
        background: var(--homey-color-ui-surface-secondary);
        border-radius: 4px;
        overflow: hidden;
      }

      .battery-level-fill {
        height: 100%;
        width: 0;
        background: var(--homey-color-green);
        transition: width 0.3s ease;
      }

      .charging-power {
        color: var(--homey-color-green);
      }

      .location-link {
        color: var(--homey-color-primary);
        text-decoration: none;
      }

      .error-message {
        display: none;
        color: var(--homey-color-error);
        font-size: var(--homey-font-size-small);
        padding: var(--homey-widget-padding, 12px);
        border-radius: var(--homey-border-radius);
        background: var(--homey-color-error-light);
        margin-bottom: var(--homey-widget-padding, 12px);
      }

      .charging-buttons {
        display: flex;
        gap: 10px;
        margin-top: var(--homey-widget-padding, 12px);
      }

      .charging-button {
        flex: 1;
        padding: var(--homey-widget-padding, 12px);
        border-radius: var(--homey-border-radius);
        border: none;
        background: var(--homey-button-primary-background);
        color: var(--homey-button-primary-text-color);
        font-weight: 500;
        cursor: pointer;
      }

      .charging-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: var(--homey-button-disabled-background);
        color: var(--homey-button-disabled-text-color);
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="error-container" class="error-message"></div>

    <div id="vehicle-container" class="vehicle-info">
      <div class="battery-section">
        <div class="info-card-value" id="battery-percentage">--</div>
        <div class="battery-level">
          <div class="battery-level-fill" id="battery-level-fill"></div>
        </div>
        <div class="info-card-value" id="range">-- km</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">Charging Status</div>
        <div class="info-card-value" id="charging-status">--</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">Plugged In</div>
        <div class="info-card-value" id="plugged-status">--</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">Last Seen</div>
        <div class="info-card-value" id="last-seen">--</div>
      </div>

      <div class="info-card">
        <div class="info-card-title">Charging Power</div>
        <div class="info-card-value charging-power" id="charging-power">--</div>
      </div>

      <div class="info-card full-width">
        <div class="info-card-title">Location</div>
        <div class="info-card-value">
          <span id="address">--</span>
          <br>
          <small><a href="#" class="location-link" id="map-link" style="display: none;">View on Map</a></small>
        </div>
      </div>
    </div>

    <div class="charging-buttons">
      <button id="startCharging" class="charging-button" disabled>Start Charging</button>
      <button id="stopCharging" class="charging-button" disabled>Stop Charging</button>
    </div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        Homey.ready();

        const settings = Homey.getSettings() || {};
        const refreshMs = Math.max(1, settings.refresh_interval || 5) * 60 * 1000;

        // The car picked when the widget was added; older widget instances have none
        let deviceId;
        try {
          const ids = typeof Homey.getDeviceIds === 'function' ? Homey.getDeviceIds() : [];
          deviceId = ids && ids.length > 0 ? ids[0] : undefined;
        } catch (error) {
          deviceId = undefined;
        }

        const el = (id) => document.getElementById(id);
        const query = deviceId ? `?deviceId=${encodeURIComponent(deviceId)}` : '';
        const body = deviceId ? { deviceId } : {};

        function showError(message) {
          el('error-container').textContent = message;
          el('error-container').style.display = 'block';
        }

        function hideError() {
          el('error-container').style.display = 'none';
        }

        function setText(id, value) {
          el(id).textContent = value === null || value === undefined || value === '' ? '--' : value;
        }

        function render(data) {
          if (typeof data.batteryLevel === 'number') {
            setText('battery-percentage', `${Math.round(data.batteryLevel)}%`);
            el('battery-level-fill').style.width = `${Math.max(0, Math.min(100, data.batteryLevel))}%`;
          }
          if (typeof data.range === 'number') {
            setText('range', `${Math.round(data.range)} km`);
          }
          setText('charging-status', data.chargingStatus);
          setText('plugged-status', data.pluggedInStatus ? 'Yes' : 'No');
          setText('last-seen', data.lastSeen);
          setText('charging-power', data.isCharging && typeof data.chargingPowerKw === 'number'
            ? `${data.chargingPowerKw.toFixed(1)} kW`
            : null);

          const mapLink = el('map-link');
          if (data.location) {
            const { latitude, longitude } = data.location;
            setText('address', data.address || `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
            mapLink.style.display = 'inline';
            mapLink.onclick = (event) => {
              event.preventDefault();
              Homey.popup(`https://www.google.com/maps?q=${latitude},${longitude}`);
            };
          } else {
            setText('address', null);
            mapLink.style.display = 'none';
          }

          el('startCharging').disabled = !data.canStartCharging;
          el('stopCharging').disabled = !data.isCharging;
        }

        function updateVehicleData() {
          return Homey.api('GET', `/vehicle-data${query}`)
            .then((data) => {
              if (data.error) {
                showError(data.error);
                return;
              }
              hideError();
              render(data);
            })
            .catch((error) => showError(error.message || 'Failed to fetch vehicle data'));
        }

        function chargingCommand(path, button, pendingText) {
          button.disabled = true;
          Homey.api('POST', path, body)
            .then((response) => {
              if (response.error) {
                showError(response.error);
                return updateVehicleData();
              }
              hideError();
              setText('charging-status', pendingText);
              // Give the car time to change state, then refresh from Enode
              setTimeout(() => {
                Homey.api('POST', '/update-data', body).finally(updateVehicleData);
              }, 10000);
              return null;
            })
            .catch((error) => {
              showError(error.message || 'Charging command failed');
              updateVehicleData();
            });
        }

        el('startCharging').onclick = () => chargingCommand('/start-charging', el('startCharging'), 'Starting...');
        el('stopCharging').onclick = () => chargingCommand('/stop-charging', el('stopCharging'), 'Stopping...');

        updateVehicleData();
        const interval = setInterval(updateVehicleData, refreshMs);
        window.addEventListener('beforeunload', () => clearInterval(interval));
      }
    </script>
  </body>
</html>
